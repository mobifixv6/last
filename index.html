    <script>
      // Service Worker Registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(reg => {
            console.log('SW Registered:', reg.scope);
          }).catch(err => {
            console.log('SW Registration failed:', err);
          });
        });
      }

      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Tajawal', 'sans-serif'],
              kufi: ['Reem Kufi', 'sans-serif'],
            },
            colors: {
              primary: '#0F766E', // Teal 700
              secondary: '#F59E0B', // Amber 500
            }
          },
        },
      }
    </script>
    <style>
      body {
        font-family: 'Tajawal', sans-serif;
        background-color: #f3f4f6;
        -webkit-tap-highlight-color: transparent;
      }

      /* إخفاء شريط التمرير ولكن السماح بالتمرير */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* تأثيرات حركية */
      .animate-scale-in {
        animation: scaleIn 0.2s ease-out forwards;
      }
      @keyframes scaleIn {
        from { transform: scale(0.95); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      
      /* تخصيص شريط التمرير */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #cbd5e1;
      }

      /* حاوية الفاتورة المخصصة للطباعة الحرارية على الهاتف والكمبيوتر */
      #dedicated-print-receipt {
        position: fixed;
        left: -9999px;
        top: 0;
        z-index: -1;
        pointer-events: none;
      }

      /* تنسيقات الطباعة */
      @media print {
        @page {
          margin: 0;
        }
        html, body {
          margin: 0 !important;
          padding: 0 !important;
          background: #ffffff !important;
          height: auto !important;
          overflow: visible !important;
        }
        body > #root > div > *:not(#dedicated-print-receipt) {
          display: none !important;
        }
        #dedicated-print-receipt,
        #dedicated-print-receipt * {
          visibility: visible !important;
        }
        #dedicated-print-receipt {
          display: flex !important;
          position: static !important;
          left: 0 !important;
          top: 0 !important;
          width: 100% !important;
          max-width: 80mm !important;
          margin: 0 auto !important;
          padding: 3mm !important;
          border: none !important;
          box-shadow: none !important;
          background: #ffffff !important;
          color: #000000 !important;
          z-index: 99999 !important;
        }
        .no-print, #dedicated-print-receipt .no-print, #dedicated-print-receipt .no-print * {
          display: none !important;
          visibility: hidden !important;
        }
      }
    </style>
